# Encoder-decoder ASR: linear (weighted-average) merge of the DECODER.
merge_method: lerp
dtype: float32
parameters:
  normalize: true
models:
  - model: model_B/decoder.safetensors
    parameters: {weight: 0.2}
  - model: model_C/decoder.safetensors
    parameters: {weight: 0.2}
  - model: model_base/decoder.safetensors
    parameters: {weight: 0.6}
